[defaults]
# Points at the directory generate_account_inventories.py populates with
# one dynamic-inventory file per discovered AWS account -- Ansible merges
# every file in a directory automatically, so this never needs to change
# as accounts are added or removed.
inventory = inventory/accounts
# roles/ and playbooks/ are siblings under ansible/, not nested -- Ansible's
# default role search path only looks inside the playbook's own directory,
# so this is required for `roles: [disk_monitor]` in playbooks/*.yml to
# resolve at all.
roles_path = roles
host_key_checking = False
retry_files_enabled = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout = 300
interpreter_python = auto_silent

[inventory]
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
# Unused when connecting via aws_ssm, kept sane for any host that does need
# a fallback SSH path (e.g. a jump host you manage outside SSM).
pipelining = True
